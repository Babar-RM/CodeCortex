name: CI

on:
  push:
    branches: [ main, "phase-*/*" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: codecortex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Push Prisma Schema to Test DB
        run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/codecortex_test"

      - name: Lint code
        run: npm run lint

      - name: Typecheck & Build
        run: npm run build

      - name: Run unit tests
        run: npm run test
        env:
          DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/codecortex_test"
          AUTH_SECRET: "test-auth-secret-key-32-characters-long"
          GITHUB_CLIENT_ID: "dummy-client-id"
          GITHUB_CLIENT_SECRET: "dummy-client-secret"

  parser-service-ci:
    name: Parser Service CI
    runs-on: ubuntu-latest
    env:
      PIP_EXTRA_INDEX_URL: "https://download.pytorch.org/whl/cpu"
      PYTHONPATH: "."
    defaults:
      run:
        working-directory: parser-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: parser-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run pytest
        run: python -m pytest
